# No build artefact: the data is the product.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: node:22
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

stages:
  - check

.node:
  before_script:
    - npm ci --cache .npm --prefer-offline

typecheck:
  extends: .node
  stage: check
  script:
    - npm run typecheck

lint:
  extends: .node
  stage: check
  script:
    - npm run format:check
    - npm run lint
    - npm run check:comments

data-integrity:
  extends: .node
  stage: check
  script:
    - npm run check
