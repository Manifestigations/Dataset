name: "Report a figure"
description: Add or correct a figure from the 2026 Autumn protests.
title: "[figure] "
labels: [data]
body:
  - type: textarea
    id: what
    attributes:
      label: What does the number measure?
      description: "crowd, strikers, arrests, injuries (which side), blockaded schools, damages, cost of policing…"
    required: true
  - type: input
    id: when
    attributes:
      label: When (ISO date)
      placeholder: 2026-11-14
    required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: "national · a region · a city · one institution"
    required: true
  - type: input
    id: value
    attributes:
      label: The number as published
      description: "Keep the range if the publisher gives one — do not average across publishers."
      placeholder: "between 175,000 and 197,000"
    required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: "A URL, a report title + page, or outlet + date. Paywalled or PDF is fine — say so."
    required: true
  - type: dropdown
    id: kind
    attributes:
      label: Count or estimate?
      options:
        - count
        - estimate
        - "I don't know"
    required: true
